<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 434" role="img" aria-labelledby="title desc">
  <title id="title">Current paths in a boost converter</title>
  <desc id="desc">When the switch is closed, the source charges the inductor through the switch, and the output capacitor powers the load. When the switch opens, current from the source and inductor flows through the diode to the output capacitor and load.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path fill="#176d51" d="M0 0l10 5-10 5z"/>
    </marker>
    <g id="base" stroke="#20354b" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M57 110V68h73q0-13 11-13t11 13q0-13 11-13t11 13q0-13 11-13t11 13q0-13 11-13t11 13h91m24 0h195v39l-8 6 16 10-16 10 16 10-8 6v15H57v-34"/>
      <path d="M41 110h32m-24 20h16m268-74v24m76-12v52m-15 0h30m-30 10h30m-15 0v34m-152-96v42m0 32v22"/>
      <path d="m309 57 24 11-24 11z" fill="#20354b"/>
      <g fill="#20354b"><circle cx="257" cy="68" r="4"/><circle cx="257" cy="164" r="4"/><circle cx="409" cy="68" r="4"/><circle cx="409" cy="164" r="4"/></g>
      <circle cx="257" cy="112" r="2.5"/><circle cx="257" cy="140" r="2.5"/>
    </g>
    <g id="labels" fill="#20354b" font-family="system-ui, sans-serif" font-size="16">
      <text x="32" y="143">−</text><text x="30" y="106">+</text>
      <text x="47" y="47">Input</text><text x="139" y="45">Inductor</text>
      <text x="283" y="45">Diode</text><text x="374" y="46">Output</text>
      <text x="426" y="131">Capacitor</text><text x="544" y="132">Load</text>
      <text x="273" y="143">Switch</text>
    </g>
  </defs>
  <rect width="620" height="434" rx="12" fill="#f8fafc"/>
  <path d="M22 217H598" stroke="#a1adba"/>
  <g font-family="system-ui, sans-serif" font-weight="700" font-size="22" fill="#20354b">
    <text x="24" y="31">Switch on · store energy</text>
    <text x="24" y="251">Switch off · deliver energy</text>
  </g>
  <g transform="translate(0 29)">
    <use href="#base"/><use href="#labels"/>
    <path d="M257 115v22" stroke="#20354b" stroke-width="2.6"/>
    <g fill="none" stroke="#176d51" stroke-width="3" marker-end="url(#arrow)">
      <path d="M76 82h166v69H77"/>
      <path d="M424 82h88v70h-83"/>
    </g>
  </g>
  <g transform="translate(0 250)">
    <use href="#base"/><use href="#labels"/>
    <path d="m257 137-14-18" stroke="#20354b" stroke-width="2.6"/>
    <g fill="none" stroke="#176d51" stroke-width="3" marker-end="url(#arrow)">
      <path d="M76 82h321"/>
      <path d="M424 82h88v70h-83"/>
      <path d="M395 150H77"/>
    </g>
  </g>
</svg>
