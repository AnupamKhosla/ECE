    <text x="30" y="68" font-size="15">25 mm² flexible copper · Cut lengths measured before stripping · Drawing is schematic</text>
    <rect x="30" y="89" width="920" height="130" rx="8" fill="#fff" stroke="#c5d1dc"/>
    <g fill="none" stroke="#41566c" stroke-width="1.3" marker-start="url(#end)" marker-end="url(#end)">
      <path d="M262 119H772"/><path d="M262 174H602"/>
