<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title description">
  <title id="title">Switch the same LED with a 2N3904</title>
  <desc id="description">Breadboard layout with distinct emitter, base and collector strips. The LED load reaches the collector, the emitter reaches return, and the command is applied through a 4.7 kilohm base resistor.</desc>
  <rect width="960" height="520" rx="14" fill="#eef4f7"/>
  <g font-family="system-ui,sans-serif" fill="#153043">
    <text x="28" y="43" font-size="24" font-weight="700">Switch the same LED with a 2N3904</text>
    <text x="28" y="76" font-size="15">Use the transistor datasheet to identify E, B and C. Each lead goes into its own numbered strip.</text>
    <rect x="59" y="174" width="612" height="238" rx="9" fill="#f8f4e9" stroke="#bbc9d0"/>
    <g fill="none" stroke="#a9b5b9" stroke-width="6" stroke-dasharray="0.5 38.5" stroke-linecap="round">
      <path d="M106 208v159"/>
      <path d="M155 208v159"/>
      <path d="M204 208v159"/>
      <path d="M253 208v159"/>
      <path d="M302 208v159"/>
      <path d="M351 208v159"/>
      <path d="M400 208v159"/>
      <path d="M449 208v159"/>
      <path d="M498 208v159"/>
      <path d="M547 208v159"/>
      <path d="M596 208v159"/>
      <path d="M645 208v159"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="106" y="106">9</text>
      <text x="155" y="106">10</text>
      <text x="204" y="106">11</text>
      <text x="253" y="106">12</text>
      <text x="302" y="106">13</text>
      <text x="351" y="106">14</text>
      <text x="400" y="106">15</text>
      <text x="449" y="106">16</text>
      <text x="498" y="106">17</text>
      <text x="547" y="106">18</text>
      <text x="596" y="106">19</text>
      <text x="645" y="106">20</text>
      <text x="76" y="213">a</text>
      <text x="76" y="252">b</text>
      <text x="76" y="291">c</text>
      <text x="76" y="330">d</text>
      <text x="76" y="369">e</text>
    </g>
    <path d="M81 119h592" stroke="#a8343c" stroke-width="3"/>
    <path d="M81 151h569" stroke="#145a95" stroke-width="3"/>
    <path d="M155 143v16" stroke="#eef4f7" stroke-width="10"/>
    <g font-size="14"><text x="29" y="124">+ rail</text><text x="29" y="156">0 V</text></g>
    <g fill="none" stroke="#243d4b" stroke-width="3">
      <path d="M155 119v89"/><path d="M155 247h98"/><path d="M253 208v-20h196v20"/>
      <path d="M351 325v-13h49v13"/><path d="M400 208v18h245v-18"/>
      <path d="M351 286H81V151" stroke="#145a95"/>
      <path d="M645 247h28V119" stroke="#a8343c"/>
    </g>
    <rect x="144" y="153" width="22" height="36" rx="5" fill="#b77b49"/>
    <rect x="182" y="236" width="43" height="22" rx="9" fill="#dc5965" stroke="#7f2834"/>
    <path d="M219 237v20" stroke="#7f2834" stroke-width="3"/>
    <rect x="493" y="215" width="65" height="22" rx="5" fill="#b77b49"/>
    <rect x="356" y="302" width="39" height="20" rx="5" fill="#b77b49"/>
    <path d="M351 364v30l29 12m20-42v42m49-42v30l-29 12" fill="none" stroke="#243d4b" stroke-width="3"/>
    <path d="M374 406h52v21a26 22 0 0 1-52 0z" fill="#243d4b"/>
    <g font-size="14">
      <text x="172" y="172">R1 · 1 kΩ</text><text x="173" y="272">A</text><text x="227" y="272">K</text>
      <text x="499" y="231">4.7 kΩ</text><text x="356" y="317" font-size="11">100 kΩ</text>
      <text x="344" y="385">E</text><text x="392" y="385">B</text><text x="446" y="385">C</text>
      <text x="720" y="202">Command wire</text><text x="720" y="230">b20 to + for ON</text>
      <text x="720" y="255">b20 to 0 V for OFF</text><text x="720" y="293">Q1 at e14, e15, e16</text>
      <text x="720" y="320">E to return at c14</text>
      <text x="720" y="347">Probe C at c16</text>
    </g>
    <text x="28" y="487" font-size="15">The 4.7 kΩ sets base current. The 100 kΩ keeps Q1 off when the command wire is disconnected.</text>
  </g>
</svg>
