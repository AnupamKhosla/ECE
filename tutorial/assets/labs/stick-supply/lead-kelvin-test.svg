<svg xmlns="http://www.w3.org/2000/svg" width="980" height="475" viewBox="0 0 980 475" role="img" aria-labelledby="title desc">
  <title id="title">Welding lead lengths and four-wire test fixture</title>
  <desc id="desc">A 3 metre electrode cable and 2 metre work-return cable both use 25 square millimetre copper. A separate test socket and test coupon give the resistance meter distinct current and sense connections.</desc>
