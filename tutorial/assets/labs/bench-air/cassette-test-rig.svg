<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" role="img" aria-labelledby="title desc">
  <title id="title">Filter cassette and airflow traverse bench</title>
  <desc id="desc">Top drawing shows room air passing through a sealed cassette, protected blower and outlet adapter into a straight measuring duct. High and low pressure taps straddle the filter. The duct is 1250 millimetres long, with probe ports 850 millimetres after its inlet. Lower views show the one hundred millimetre square duct with sixteen equal-area sample positions and the cassette seat with rails and latches.</desc>
