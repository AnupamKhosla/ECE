<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 455" role="img" aria-labelledby="title desc">
  <title id="title">Five-volt door-left-open indicator schematic</title>
  <desc id="desc">The 68 kilohm divider and 100 microfarad capacitor feed the inverting input of an LM393. The magnet contact and 1 kilohm reset resistor discharge the capacitor when the door closes. A 27 kilohm and 10 kilohm divider set the non-inverting reference. A 330 kilohm feedback resistor connects output to reference. The open collector sinks a red LED and has a 10 kilohm pull-up.</desc>
  <defs>
    <path id="r" d="M0 0v9l-7 7 14 10-14 10 14 10-7 7v9" fill="none"/>
    <path id="g" d="M0 0v9m-11 0h22m-17 6h12m-9 6h6" fill="none"/>
  </defs>
  <rect width="780" height="455" rx="10" fill="#f7fafc"/>
  <g fill="none" stroke="#24374b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M45 52H736M95 52v21m0 62v124m0 62v23M195 172v80m-11 0h22m-22 10h22m-11 0v82M266 172v22m0 62v24m0 34v30M95 172H435"/>
