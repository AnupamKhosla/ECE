<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">150 millimetre shaft and two bearing support plates</title>
  <desc id="desc">A hand-turned shaft with 608 bearings on a base. The front view shows the two opposed support plates and the indicator point. Separate views show the bolt pattern and section through the locating and floating bearing pockets.</desc>
  <defs>
    <marker id="dim" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="m1 1 5 3-5 3" fill="none" stroke="#365164" stroke-width="1.3"/></marker>
  </defs>
  <rect width="1000" height="760" rx="14" fill="#f4f7fa"/>
  <g font-family="system-ui,sans-serif" fill="#172b3b">
    <text x="29" y="40" font-size="24" font-weight="700">P180 · Make and align two bearing supports</text>
    <text x="29" y="66" font-size="15">Rev A · mm · Hand-turned fixture · Views schematic</text>
    <rect x="28" y="84" width="944" height="267" rx="8" fill="#fff" stroke="#ccd7df"/>
    <text x="50" y="114" font-size="18" font-weight="700">Front elevation</text>
    <path d="M113 280H880v19H113z" fill="#a0b1bf" stroke="#476075"/>
    <g fill="#ccd9e2" stroke="#476075" stroke-width="1.4">
      <rect x="304" y="155" width="51" height="125"/><rect x="625" y="155" width="51" height="125"/>
      <rect x="292" y="189" width="12" height="58"/><rect x="676" y="189" width="12" height="58"/>
    </g>
    <path d="M177 218H816" stroke="#2a4c64" stroke-width="14"/>
    <path d="M167 218H825" stroke="#fff" stroke-dasharray="10 6" stroke-width="1.2"/>
    <g fill="#d19a4f" stroke="#79561d"><rect x="252" y="200" width="38" height="36"/><rect x="350" y="200" width="38" height="36"/><rect x="591" y="200" width="38" height="36"/><rect x="690" y="200" width="38" height="36"/></g>
    <g fill="none" stroke="#365164" stroke-width="1.25">
      <path d="M113 302v27m767-27v27M177 128v72M816 128v72M304 249v24m372-24v24"/>
      <path d="M113 321H880" marker-start="url(#dim)" marker-end="url(#dim)"/>
      <path d="M177 140H816" marker-start="url(#dim)" marker-end="url(#dim)"/>
      <path d="M304 263H676" marker-start="url(#dim)" marker-end="url(#dim)"/>
      <path d="M727 171h25v36" marker-end="url(#dim)"/>
    </g>
    <g font-size="15"><text x="427" y="132">150 ±0.5 long</text><text x="396" y="255">87 between outer plate faces</text>
    <text x="386" y="340">180 × 90 × 6 base plate</text>
    <text x="252" y="177">Locating end</text><text x="575" y="177">Floating end</text>
    <text x="710" y="163">Dial probe</text><text x="739" y="246">15 from keeper face</text></g>

    <rect x="28" y="365" width="339" height="298" rx="8" fill="#fff" stroke="#ccd7df"/>
    <text x="48" y="397" font-size="18" font-weight="700">Upright viewed from outside</text>
    <rect x="95" y="433" width="210" height="161" fill="#ccd9e2" stroke="#476075"/>
    <rect x="139" y="452" width="123" height="123" fill="none" stroke="#526d7f" stroke-dasharray="6 4"/>
    <circle cx="200" cy="513" r="35.4" fill="#fff" stroke="#476075" stroke-width="1.6"/>
    <path d="M144 513h112m-56-53v106" stroke="#526d7f" stroke-dasharray="6 4" fill="none"/>
    <g fill="#fff" stroke="#526d7f" stroke-width="1.6">
      <circle cx="158" cy="471" r="6"/><circle cx="242" cy="471" r="6"/><circle cx="158" cy="555" r="6"/><circle cx="242" cy="555" r="6"/>
      <circle cx="116" cy="562" r="7"/><circle cx="284" cy="562" r="7"/>
    </g>
    <g font-size="14">
      <text x="49" y="424">65 wide × 50 high × 12 thick</text>
      <text x="49" y="614">Axis centred across width, 25 from foot.</text>
      <text x="49" y="635">4 × M4 at ±13 both ways from axis.</text>
      <text x="49" y="655">2 × Ø5.5 at 6.5 from edges, 10 above foot.</text>
    </g>

    <rect x="385" y="365" width="587" height="298" rx="8" fill="#fff" stroke="#ccd7df"/>
    <text x="405" y="397" font-size="18" font-weight="700">Section through one bearing</text>
    <g stroke="#476075" stroke-width="1.5" fill="#ccd9e2">
      <path d="M520 430h132v53h-54v-17h-78z M520 577h78v-17h54v53H520z"/>
      <path d="M484 438h27v43h-27z M484 562h27v43h-27z"/>
    </g>
    <g fill="#d19a4f" stroke="#79561d" stroke-width="1.4">
      <path d="M520 466h78v16h-78z M520 561h78v16h-78z"/>
      <path d="M520 501h78v13h-78z M520 529h78v13h-78z"/>
    </g>
    <g fill="#9eb7ca" stroke="#476075">
      <path d="M454 501h66v13h-66z M454 529h66v13h-66z M598 501h66v13h-66z M598 529h66v13h-66z"/>
    </g>
    <rect x="443" y="514" width="231" height="15" fill="#2a4c64"/>
    <g fill="#617e95"><circle cx="557" cy="491.5" r="8.5"/><circle cx="557" cy="551.5" r="8.5"/></g>
    <path d="M513 453v-15h101m-3 21h38m2 34h29m-6 25h6m-16 20h16" fill="none" stroke="#365164" stroke-width="1.3"/>
    <g font-size="14">
      <text x="405" y="423">3 thick keeper, Ø19.5 opening</text>
      <text x="659" y="459">Ø22.000–22.020 pocket</text>
      <text x="690" y="490">Ø19.5 ±0.1 through relief</text>
      <text x="690" y="520">Ø8 ground shaft</text>
      <text x="690" y="541">Ø10.25 spacer to inner ring</text>
      <text x="681" y="565">Pocket depth above bearing width</text>
      <text x="681" y="588">Locating end · 0.05 to 0.10</text>
      <text x="681" y="610">Floating end · 0.30 to 0.50</text>
      <text x="405" y="630">Mirror the plates so both keepers face out.</text>
      <text x="405" y="649">The outer ring seats against the shoulder or keeper.</text>
    </g>
    <text x="29" y="698" font-size="15">Centre the stands on the 90-wide base. Transfer the four foot holes from the aligned assembly and drill Ø6.5.</text>
    <text x="29" y="725" font-size="15">Set the indicator at both ends. Turn the shaft by hand and log maximum minus minimum at each point.</text>
  </g>
</svg>
