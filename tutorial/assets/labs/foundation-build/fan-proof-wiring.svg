<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 605" role="img" aria-labelledby="title desc">
  <title id="title">Wiring a guarded 5 V fan with relay switching and rotation feedback</title>
  <desc id="desc">GPIO25 drives a 2N3904 through 680 ohms. The transistor energises the 5 V relay coil, and the normally open contact switches the fan positive lead. The fan tach output and 4.7 kilohm pull-up go to GPIO33. The two power supplies share ground but their positive rails are separate.</desc>
  <rect width="830" height="605" rx="14" fill="#f7fafc"/>
  <g font-family="system-ui,sans-serif" fill="#172d43">
    <g font-weight="700" font-size="23">
      <text x="28" y="39">1 · Switch the relay coil</text>
      <text x="28" y="239">2 · Switch the fan’s positive lead</text>
      <text x="28" y="447">3 · Read the open-collector tach output</text>
    </g>
    <g fill="none" stroke="#28425a" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
