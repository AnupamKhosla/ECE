<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 660" role="img" aria-labelledby="title desc">
  <title id="title">P133 enclosure and wiring for the external-adapter bench blower</title>
  <desc id="desc">Drawing of a 160 by 140 by 80 millimetre case. The fan faces the outlet end and has a top intake. The guard frames and guarded outlet transition sit outside the case. The opposite end has a DC jack and switch. The external supply connects through positive fuse and switch to the blower, with a separate negative return.</desc>
