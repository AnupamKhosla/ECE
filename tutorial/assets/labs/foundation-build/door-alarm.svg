    <use href="#g" x="95" y="344"/><use href="#g" x="195" y="344"/><use href="#g" x="266" y="344"/>
    <path d="M380 52v112m0 16v4m0 62v45m0 62v7M380 272H435"/>
    <use href="#r" x="380" y="184"/><use href="#r" x="380" y="291"/>
    <use href="#g" x="380" y="360"/>
    <path d="M435 145v151l128-69.5zM495 178v-60M495 264v53"/>
    <use href="#g" x="495" y="317"/>
    <path d="M563 227H730M625 52v23m0 62v90M730 52v23m0 62v20m-10 20h20m-10 0v50"/>
    <use href="#r" x="625" y="75"/><use href="#r" x="730" y="75"/>
    <path d="M720 157h20l-10 20z" fill="#a82926" stroke="#a82926"/>
    <path d="m740 155 12-9m-5-1 5 1-1 5m-9 9 12-9m-5-1 5 1-1 5" stroke="#a82926"/>
    <path d="M380 272H351v137H455M517 409h46V227"/>
    <use href="#r" transform="translate(455 409) rotate(-90)"/>
  </g>
  <g fill="#24374b">
    <circle cx="95" cy="172" r="4"/><circle cx="195" cy="172" r="4"/><circle cx="266" cy="172" r="4"/>
    <circle cx="266" cy="280" r="3"/><circle cx="266" cy="314" r="3"/>
    <circle cx="380" cy="272" r="4"/><circle cx="563" cy="227" r="4"/>
    <circle cx="625" cy="227" r="4"/><circle cx="95" cy="52" r="4"/><circle cx="380" cy="52" r="4"/><circle cx="625" cy="52" r="4"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="17" fill="#24374b">
    <text x="45" y="32" font-size="22" font-weight="700">+5 V</text>
    <text x="109" y="110">R1 68 kΩ</text><text x="109" y="298">R2 68 kΩ</text>
    <text x="105" y="159" font-weight="700">SENSE</text><text x="108" y="225">C1 100 µF</text>
    <text x="174" y="248">+</text><text x="277" y="234">R3 1 kΩ</text>
    <text x="282" y="299">S1 reed</text>
    <text x="282" y="195">R4 27 kΩ</text><text x="395" y="336">R5 10 kΩ</text>
    <text x="389" y="263" font-weight="700">REF</text><text x="409" y="159">2</text>
    <text x="446" y="178">−</text><text x="446" y="275">+</text><text x="415" y="292">3</text>
    <text x="454" y="231" font-weight="700">U1A</text>
    <text x="511" y="121">8 → +5 V</text><text x="511" y="314">4 → GND</text>
    <text x="570" y="214" font-weight="700">1 · OUT</text>
    <text x="535" y="104">R7 10 kΩ</text><text x="643" y="104">R8 2.2 kΩ</text>
    <text x="677" y="180" fill="#a82926">D1</text>
    <text x="435" y="440">R6 330 kΩ feedback</text>
    <text x="27" y="397">C2 100 nF from +5 V to GND.</text>
    <text x="27" y="422">U1B pin 5 → GND, 6 → REF, 7 open.</text>
  </g>
</svg>
