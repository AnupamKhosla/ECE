<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" role="img" aria-labelledby="title desc">
  <title id="title">W09 pilot steel case fit drawing</title>
  <desc id="desc">Top and front views of a 340 by 170 by 170 millimetre bolted steel enclosure fit mock-up. The top view shows case rail holes and a dummy power module. The front view shows outlines for a removable blank and the hardware transfer zones.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto-start-reverse">
      <path d="M0 0 6 4 0 8z" fill="#385474"/>
    </marker>
  </defs>
  <style>
    text{font-family:system-ui,sans-serif;fill:#142637;font-size:17px}
    .title{font-size:29px;font-weight:700}.head{font-size:21px;font-weight:700}.note{font-size:15px}
    .outline{fill:#f6fafc;stroke:#172d43;stroke-width:2}.rail{fill:#e7eff6;stroke:#456078;stroke-width:1.5}
    .zone{fill:#fff3d9;stroke:#866316;stroke-width:1.5;stroke-dasharray:7 4}.hole{fill:white;stroke:#172d43;stroke-width:1.6}
    .line{fill:none;stroke:#385474;stroke-width:1.4}.dim{marker-start:url(#arrow);marker-end:url(#arrow)}
  </style>
  <rect width="980" height="660" fill="white"/>
  <text x="38" y="49" class="title">W09 · First enclosure fit check</text>
  <text x="38" y="78">Unpowered sample · dimensions in mm · transfer parts from actual hardware</text>
  <text x="85" y="130" class="head">Top view · lid removed</text>
  <text x="668" y="130" class="head">Front view</text>

  <rect x="85" y="193" width="476" height="238" class="outline"/>
  <rect x="113" y="196" width="420" height="28" class="rail"/>
  <rect x="113" y="400" width="420" height="28" class="rail"/>
  <rect x="138" y="242" width="371" height="128" class="zone"/>
  <text x="323" y="290" text-anchor="middle">Example dummy power module</text>
  <text x="323" y="318" text-anchor="middle">265 × 92 footprint · 110 high</text>
  <text x="323" y="345" text-anchor="middle" class="note">Check real heat sink, duct and terminal envelopes</text>
  <g class="hole">
    <circle cx="127" cy="207" r="4.5"/><circle cx="323" cy="207" r="4.5"/><circle cx="519" cy="207" r="4.5"/>
    <circle cx="127" cy="417" r="4.5"/><circle cx="323" cy="417" r="4.5"/><circle cx="519" cy="417" r="4.5"/>
  </g>
  <g class="line">
    <path d="M85 187V150M561 187V150M80 193H45M80 431H45"/>
    <path class="dim" d="M87 158H559M53 195V429"/>
  </g>
  <text x="323" y="152" text-anchor="middle">340</text>
  <text x="39" y="312" transform="rotate(-90 39 312)" text-anchor="middle">170</text>
  <text x="85" y="455">A · front-left outside corner</text>
  <text x="561" y="455" text-anchor="end">Rear</text>

  <rect x="666" y="193" width="238" height="238" class="outline"/>
  <rect x="669" y="196" width="232" height="232" fill="white" stroke="#456078" stroke-width="1.5"/>
  <rect x="690" y="224" width="190" height="64" rx="5" class="zone"/>
  <rect x="690" y="326" width="190" height="75" rx="5" class="zone"/>
  <text x="785" y="252" text-anchor="middle">Controls and indicators</text>
  <text x="785" y="277" text-anchor="middle" class="note">Transfer from supplier drawing</text>
  <text x="785" y="355" text-anchor="middle">Output sockets</text>
  <text x="785" y="381" text-anchor="middle" class="note">Check rear lug access</text>
  <g class="line">
    <path d="M666 187V150M904 187V150M909 193H950M909 431H950"/>
    <path class="dim" d="M668 158H902M941 195V429"/>
  </g>
  <text x="785" y="152" text-anchor="middle">170</text>
  <text x="962" y="312" transform="rotate(-90 962 312)" text-anchor="middle">170</text>

  <rect x="38" y="492" width="904" height="125" rx="7" fill="#eff5fa" stroke="#bdcad6"/>
  <text x="59" y="522" class="head">Base and lid drill coordinates from A</text>
  <text x="59" y="552">X along depth: 30, 170, 310. Y across width: 10 and 160. Six Ø4.5 holes per face for M4.</text>
  <text x="59" y="578">Transfer into the rails on trial assembly. Use mated, labelled blanks for fit checks.</text>
  <text x="59" y="601" class="note">Specify connectors, fan, handle reinforcement, electrical clearances and vents on the released drawings.</text>
</svg>
