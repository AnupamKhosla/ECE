    <path d="M618 203l26-12h28l-13 10 13 11h-28z" fill="#b27736"/>
    <g font-size="14"><text x="52" y="153">DIX SKM 25</text><text x="52" y="208">DIX SKM 25</text><text x="464" y="111">3,000 ± 20 mm</text><text x="380" y="167">2,000 ± 20 mm</text><text x="784" y="127">Electrode holder</text><text x="688" y="208">Work-return clamp</text></g>
    <text x="30" y="253" font-size="20" font-weight="700">Measure one lead using the meter and jig only</text>
    <rect x="31" y="287" width="151" height="122" rx="9" fill="#fff" stroke="#8094a6"/>
